<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon AI</title>
    <style>
        :root {
            --bg-main: #f9f6f0;
            --sidebar-bg: #f3eee3;
            --text-dark: #191919;
            --accent-orange: #d97706;
            --border-color: #e5e0d8;
            --chat-bubble-user: #f3eee3;
            --chat-bubble-ai: transparent;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body, html {
            height: 100%;
            background: var(--bg-main);
            color: var(--text-dark);
            overflow: hidden;
        }

        /* Setup Screen */
        #setup-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .setup-card {
            background: white;
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            text-align: center;
        }

        .setup-card h1 {
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .setup-card p {
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .setup-card input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 16px;
            outline: none;
        }

        .setup-card button {
            width: 100%;
            padding: 12px;
            background: var(--text-dark);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .setup-card button:hover {
            background: #333;
        }

        .error-msg {
            color: #dc2626;
            font-size: 13px;
            margin-top: -8px;
            margin-bottom: 12px;
            display: none;
        }

        /* Main Workspace Layout */
        #app-container {
            display: none;
            height: 100%;
            width: 100%;
        }

        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            border-right: 1px solid var(--border-color);
            background: var(--bg-main);
        }

        .app-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-main);
        }

        .app-header h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .disconnect-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .message {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .message.user .bubble {
            align-self: flex-end;
            background: var(--chat-bubble-user);
            padding: 12px 18px;
            border-radius: 18px;
            max-width: 80%;
        }

        .message.ai .bubble {
            align-self: flex-start;
            line-height: 1.6;
            font-size: 15px;
            width: 100%;
            white-space: pre-wrap;
        }

        /* Code Preview Box */
        .artifact-box {
            border: 1px solid var(--border-color);
            background: white;
            border-radius: 8px;
            padding: 12px 16px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            max-width: 400px;
        }

        .artifact-box:hover {
            border-color: var(--accent-orange);
        }

        .input-area {
            padding: 24px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .input-container {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.02);
        }

        .input-container textarea {
            width: 100%;
            border: none;
            outline: none;
            resize: none;
            font-size: 15px;
            min-height: 50px;
            line-height: 1.5;
        }

        .input-controls {
            display: flex;
            justify-content: flex-end;
        }

        .send-btn {
            background: var(--text-dark);
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* Right Panel: Split Code Viewer */
        .preview-section {
            flex: 1;
            background: #1e1e1e;
            display: flex;
            flex-direction: column;
            height: 100%;
            border-left: 1px solid #333;
        }

        .preview-header {
            background: #252526;
            padding: 12px 24px;
            border-bottom: 1px solid #333;
            color: #ccc;
            font-size: 13px;
            display: flex;
            gap: 16px;
        }

        .preview-tab {
            cursor: pointer;
            padding: 4px 8px;
            border-bottom: 2px solid transparent;
        }

        .preview-tab.active {
            color: white;
            border-color: var(--accent-orange);
        }

        .preview-body {
            flex: 1;
            width: 100%;
            position: relative;
        }

        .code-display {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #1e1e1e;
            color: #d4d4d4;
            font-family: monospace;
            padding: 20px;
            border: none;
            resize: none;
            font-size: 14px;
            outline: none;
            display: none;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
    </style>
</head>
<body>
    <!-- Setup Login Screen -->
    <div id="setup-screen">
        <div class="setup-card">
            <h1>Horizon AI</h1>
            <p>Enter your OpenAI API key to initiate the developer workspace.</p>
            <input type="password" id="api-key-input" placeholder="sk-proj-..." autocomplete="off">
            <div class="error-msg" id="setup-error">Invalid API key. Please check your token status.</div>
            <button id="connect-btn" onclick="validateAndLaunch()">Launch Workspace</button>
        </div>
    </div>

    <!-- Live Workspace UI -->
    <div id="app-container">
        <div class="chat-section">
            <div class="app-header">
                <h2>Horizon AI</h2>
                <button class="disconnect-btn" onclick="disconnectKey()">Disconnect</button>
            </div>
            <div class="chat-history" id="chat-history">
                <div class="message ai">
                    <div class="bubble">Hello! I am Horizon AI, optimized for engineering, design, and code structure scripting. Ask me to draft layouts, scripts, or apps.</div>
                </div>
            </div>
            <div class="input-area">
                <div class="input-container">
                    <textarea id="user-input" placeholder="Ask Horizon to write code..."></textarea>
                    <div class="input-controls">
                        <button class="send-btn" onclick="handleSend()">↑</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="preview-section">
            <div class="preview-header">
                <div class="preview-tab active" id="tab-view" onclick="switchTab('view')">Live Preview</div>
                <div class="preview-tab" id="tab-code" onclick="switchTab('code')">Source Code</div>
            </div>
            <div class="preview-body">
                <iframe id="live-frame" srcdoc="<div style='padding:40px; font-family:sans-serif; text-align:center; color:#888;'>No preview payload built yet.</div>"></iframe>
                <textarea class="code-display" id="code-text-area" readonly></textarea>
            </div>
        </div>
    </div>

    <script>
        let openaiKey = "";
        let chatMessages = [
            {"role": "system", "content": "You are Horizon AI, a highly technical programming assistant built to mimic Claude's code scripting capability. If the user asks for code, web layout, app, or UI elements, always generate a fully self-contained HTML document containing its own CSS/JS inside <style> and <script> tags. Wrap the complete code document inside standard markdown code blocks, starting with ```html"}
        ];
        let currentArtifactCode = "";

        window.onload = function() {
            const savedKey = localStorage.getItem("horizon_secure_key");
            if (savedKey) {
                openaiKey = savedKey;
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
            }
        };

        async function validateAndLaunch() {
            const inputField = document.getElementById('api-key-input');
            const errorLabel = document.getElementById('setup-error');
            const btn = document.getElementById('connect-btn');
            const keyTrigger = inputField.value.trim();

            if (!keyTrigger) return;

            btn.innerText = "Verifying connection...";
            errorLabel.style.display = "none";

            try {
                const response = await fetch("[https://api.openai.com/v1/chat/completions](https://api.openai.com/v1/chat/completions)", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${keyTrigger}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: [{role: "user", content: "Ping"}],
                        max_tokens: 5
                    })
                });

                if (response.ok) {
                    openaiKey = keyTrigger;
                    localStorage.setItem("horizon_secure_key", keyTrigger);
                    document.getElementById('setup-screen').style.display = 'none';
                    document.getElementById('app-container').style.display = 'flex';
                } else {
                    throw new Error("Validation failed");
                }
            } catch (err) {
                errorLabel.style.display = "block";
                btn.innerText = "Launch Workspace";
            }
        }

        function disconnectKey() {
            localStorage.removeItem("horizon_secure_key");
            location.reload();
        }

        async function handleSend() {
            const inputArea = document.getElementById('user-input');
            const promptText = inputArea.value.trim();
            if (!promptText) return;

            inputArea.value = "";
            appendMessage("user", promptText);
            chatMessages.push({"role": "user", "content": promptText});

            try {
                const response = await fetch("[https://api.openai.com/v1/chat/completions](https://api.openai.com/v1/chat/completions)", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${openaiKey}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o",
                        messages: chatMessages
                    })
                });

                const data = await response.json();
                const aiResponseText = data.choices[0].message.content;
                chatMessages.push({"role": "assistant", "content": aiResponseText});
                appendMessage("ai", aiResponseText);
                extractAndRenderArtifact(aiResponseText);
            } catch (e) {
                appendMessage("ai", "System connection drop: Unable to reach processing layer.");
            }
        }

        function appendMessage(sender, text) {
            const history = document.getElementById('chat-history');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            const bubble = document.createElement('div');
            bubble.className = "bubble";
            bubble.textContent = text;
            msgDiv.appendChild(bubble);
            history.appendChild(msgDiv);
            history.scrollTop = history.scrollHeight;
        }

        function extractAndRenderArtifact(text) {
            const match = text.match(/```html([\s\S]*?)```/);
            if (match && match[1]) {
                currentArtifactCode = match[1].trim();
                const history = document.getElementById('chat-history');
                const artifactAnchor = document.createElement('div');
                artifactAnchor.className = "artifact-box";
                artifactAnchor.innerHTML = `<div><strong style="font-size:14px; display:block;">Generated Workspace UI Component</strong><span style="font-size:12px; color:#666;">Click to view dynamic execution layout</span></div><span style="color:var(--accent-orange); font-weight:bold;">&rarr;</span>`;
                artifactAnchor.onclick = () => loadCodeIntoPreview(currentArtifactCode);
                history.appendChild(artifactAnchor);
                history.scrollTop = history.scrollHeight;
                loadCodeIntoPreview(currentArtifactCode);
            }
        }

        function loadCodeIntoPreview(code) {
            document.getElementById('live-frame').style.display = "block";
            document.getElementById('code-text-area').style.display = "none";
            document.getElementById('tab-view').classList.add('active');
            document.getElementById('tab-code').classList.remove('active');
            document.getElementById('live-frame').srcdoc = code;
            document.getElementById('code-text-area').value = code;
        }

        function switchTab(type) {
            const frame = document.getElementById('live-frame');
            const codeArea = document.getElementById('code-text-area');
            const tabView = document.getElementById('tab-view');
            const tabCode = document.getElementById('tab-code');

            if (type === 'view') {
                frame.style.display = "block";
                codeArea.style.display = "none";
                tabView.classList.add('active');
                tabCode.classList.remove('active');
            } else {
                frame.style.display = "none";
                codeArea.style.display = "block";
                tabView.classList.remove('active');
                tabCode.classList.add('active');
            }
        }
    </script>
</body>
</html>
